name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log || {
            tail -n 30 install.log | while IFS= read -r line; do echo "::error title=pnpm install::$line"; done
            exit 1
          }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Car atlases match the art pipeline
        run: pnpm art:check
      - run: pnpm build

  # The PostgreSQL suites (tests/integration/persistence*.test.ts, tests/unit/db*.test.ts)
  # against a real database. In the check job above the PostgreSQL suite skips itself.
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bolt
          POSTGRES_PASSWORD: bolt-ci-only
          POSTGRES_DB: bolt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bolt -d bolt_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log || {
            tail -n 30 install.log | while IFS= read -r line; do echo "::error title=pnpm install::$line"; done
            exit 1
          }
      - run: pnpm test:db
        env:
          BOLT_TEST_DATABASE_URL: postgres://bolt:bolt-ci-only@localhost:5432/bolt_test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log || {
            tail -n 30 install.log | while IFS= read -r line; do echo "::error title=pnpm install::$line"; done
            exit 1
          }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
