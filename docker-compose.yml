# Local development stack: PostgreSQL and the game server, which also serves the built web
# client on the same port, as it does in production. This is not the deployment: Milestone G
# adds production images, Caddy and HTTPS. See docs/PERSISTENCE.md.
#
#   pnpm install && pnpm build      # on the host, once and after every change
#   docker compose up               # then open http://localhost:2567
#
# The server container runs the bundle built on the host (apps/server/dist and apps/web/dist)
# with the host's node_modules, mounted read-only. Every value below has a development
# default; set real ones in .env (see .env.example) and never commit them.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bolt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bolt-dev-only}
      POSTGRES_DB: bolt
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bolt -d bolt']
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ['node', '--enable-source-maps', 'apps/server/dist/main.js']
    volumes:
      - .:/app:ro
    environment:
      NODE_ENV: development
      PORT: '2567'
      DATABASE_URL: postgres://bolt:${POSTGRES_PASSWORD:-bolt-dev-only}@postgres:5432/bolt
      GUEST_TOKEN_SECRET: ${GUEST_TOKEN_SECRET:-dev-only-change-me-0000000000000000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '2567:2567'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:2567/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
